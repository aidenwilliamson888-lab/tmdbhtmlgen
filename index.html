<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 StreamGen · TMDB Movie Page Generator</title>
    <!-- google fonts + font awesome 6 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b0f1a;
            font-family: 'Inter', system-ui, sans-serif;
            color: #eef3fc;
            padding: 2rem 1.5rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .generator-wrapper {
            max-width: 1400px;
            width: 100%;
        }
        /* header */
        .top-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            gap: 1rem;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-weight: 700;
            font-size: 1.9rem;
            background: linear-gradient(145deg, #a0c0ff, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo i {
            background: #1f2b48;
            padding: 0.7rem;
            border-radius: 1.5rem;
            color: #5f8aff;
            font-size: 1.8rem;
            -webkit-text-fill-color: #5f8aff;
        }
        .tmdb-badge {
            background: #032541;
            color: white;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #3a5a8a;
        }
        /* kontrol panel */
        .control-panel {
            background: #131e33;
            border-radius: 2rem;
            padding: 1.8rem 2rem;
            margin-bottom: 2.5rem;
            border: 1px solid #2e3f60;
            box-shadow: 0 20px 35px -10px black;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem 2rem;
            align-items: end;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .input-group label {
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            color: #a5c0ff;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .input-group input, .input-group select {
            background: #0c1322;
            border: 1px solid #2c3d60;
            border-radius: 60px;
            padding: 0.8rem 1.3rem;
            font-size: 1rem;
            color: white;
            outline: none;
            transition: 0.2s;
            font-family: 'Inter', monospace;
        }
        .input-group input:focus, .input-group select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px #1e3a8a40;
        }
        .input-group input::placeholder {
            color: #5c6f97;
        }
        .button-group {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            justify-content: flex-end;
            align-items: center;
        }
        .btn {
            background: #28344e;
            border: none;
            border-radius: 40px;
            padding: 0.8rem 1.8rem;
            font-weight: 600;
            font-size: 0.95rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            border: 1px solid #3f5185;
        }
        .btn-primary {
            background: #1d4ed8;
            border-color: #3b82f6;
        }
        .btn-primary:hover {
            background: #2563eb;
            transform: scale(1.02);
        }
        .btn-outline:hover {
            background: #2f405e;
        }

        /* live preview panel */
        .preview-header {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin: 1.5rem 0 1rem 0;
        }
        .preview-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
        }
        .pill {
            background: #1b2a45;
            border-radius: 30px;
            padding: 0.3rem 1rem;
            font-size: 0.8rem;
            color: #9ab9ff;
        }

        /* STREAMING PAGE PREVIEW (seperti web streaming sungguhan) */
        .streaming-page {
            background: #0f172b;
            border-radius: 2.5rem;
            border: 1px solid #293b60;
            padding: 2rem 2rem 1.5rem;
            box-shadow: 0 25px 45px -15px #00000080;
            margin-top: 0.5rem;
            transition: all 0.2s;
        }

        .movie-hero {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 2rem;
            margin-bottom: 2.5rem;
        }
        .poster-frame {
            border-radius: 1.8rem;
            overflow: hidden;
            background: #0b1425;
            box-shadow: 0 20px 30px -10px black;
            border: 1px solid #354d7a;
            aspect-ratio: 2/3;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .poster-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .poster-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #4d6b9e;
            text-align: center;
            font-size: 0.9rem;
            background: #101a30;
            width: 100%;
            height: 100%;
        }
        .hero-content {
            display: flex;
            flex-direction: column;
        }
        .hero-content h1 {
            font-size: 2.6rem;
            font-weight: 700;
            line-height: 1.2;
        }
        .original-title {
            color: #97b5f0;
            font-size: 1.3rem;
            margin-bottom: 1rem;
        }
        .meta-line {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin: 1rem 0;
        }
        .meta-badge {
            background: #1b2848;
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .rating {
            background: #223055;
        }
        .overview-box {
            background: #0b1425b0;
            border-radius: 1.5rem;
            padding: 1.3rem 1.5rem;
            border: 1px solid #2a3d64;
            margin: 1.5rem 0 1rem;
            backdrop-filter: blur(4px);
        }

        /* streaming links / download section */
        .links-section {
            margin-top: 2.2rem;
        }
        .section-title-small {
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 2px solid #1d2d4e;
            padding-bottom: 0.5rem;
            margin-bottom: 1.2rem;
        }
        .link-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .stream-link {
            background: #1f2c48;
            padding: 0.8rem 1.6rem;
            border-radius: 40px;
            border: 1px solid #3f5b92;
            color: white;
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            transition: 0.2s;
            font-size: 0.95rem;
        }
        .stream-link:hover {
            background: #2d4070;
            border-color: #5f8aff;
            transform: translateY(-2px);
        }
        .download-link {
            background: #1d3a3a;
            border-color: #1e7e6c;
        }
        .download-link:hover { background: #25655a; }

        .rec-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 1.2rem;
            margin-top: 2rem;
        }
        .rec-item {
            background: #162035;
            border-radius: 1.2rem;
            overflow: hidden;
            border: 1px solid #31486a;
        }
        .rec-item img {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
        }
        .rec-item .rec-title {
            padding: 0.5rem;
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .footer-copyright {
            margin-top: 2.5rem;
            text-align: center;
            color: #5d74a5;
        }

        /* loading / error state */
        .error-banner {
            background: #3f1f1f;
            border-left: 5px solid #f87171;
            padding: 0.8rem 1.5rem;
            border-radius: 60px;
            margin-bottom: 1rem;
        }
        .small-note { font-size: 0.85rem; color: #7b93c7; margin-top: 0.3rem; }
    </style>
</head>
<body>
<div class="generator-wrapper">
    <!-- top bar -->
    <div class="top-bar">
        <div class="logo">
            <i class="fas fa-sliders"></i> Stream<span style="font-weight:300;">Gen</span>
        </div>
        <div class="tmdb-badge"><i class="fas fa-database"></i> TMDB · 3a660b31</div>
    </div>

    <!-- control panel: API, title, links -->
    <div class="control-panel" id="controlPanel">
        <div class="input-group">
            <label><i class="fas fa-key"></i> TMDB API Key</label>
            <input type="text" id="apiKeyInput" placeholder="3a660b31f4af8da5f2bd6f2799c11e2e" value="3a660b31f4af8da5f2bd6f2799c11e2e">
        </div>
        <div class="input-group">
            <label><i class="fas fa-film"></i> Movie ID / judul</label>
            <input type="text" id="movieIdInput" placeholder="76600 (Avatar 3)" value="76600">
            <div class="small-note">Contoh: 76600 (Avatar 3), 157336 (Interstellar)</div>
        </div>
        <div class="input-group">
            <label><i class="fas fa-globe"></i> Bahasa</label>
            <select id="langSelect">
                <option value="en-US">🇬🇧 English</option>
                <option value="th-TH" selected>🇹🇭 ไทย</option>
                <option value="id-ID">🇮🇩 Indonesia</option>
                <option value="es-ES">🇪🇸 Español</option>
                <option value="fr-FR">🇫🇷 Français</option>
                <option value="zh-CN">🇨🇳 中文</option>
                <option value="ja-JP">🇯🇵 日本語</option>
                <option value="ko-KR">🇰🇷 한국어</option>
                <option value="hi-IN">🇮🇳 हिन्दी</option>
            </select>
        </div>
        <div class="input-group">
            <label><i class="fas fa-link"></i> Judul Link 1 (tonton)</label>
            <input type="text" id="link1Text" placeholder="▶ ดูหนัง HD" value="▶ ดูหนัง อวตาร 3 พากย์ไทย">
        </div>
        <div class="input-group">
            <label><i class="fas fa-download"></i> Link URL 1</label>
            <input type="url" id="link1Url" placeholder="https://example.com/watch" value="https://t.co/pmyrhw8flH">
        </div>
        <div class="input-group">
            <label><i class="fas fa-link"></i> Judul Link 2 (ดาวน์โหลด)</label>
            <input type="text" id="link2Text" placeholder="⬇️ ดาวน์โหลด Full HD" value="⬇️ ดาวน์โหลด อวตาร 3 (THAI)">
        </div>
        <div class="input-group">
            <label><i class="fas fa-download"></i> Link URL 2</label>
            <input type="url" id="link2Url" placeholder="https://example.com/download" value="https://avatar3-thai.readme.io/">
        </div>
        <div class="button-group">
            <button class="btn btn-primary" id="generateBtn"><i class="fas fa-magic"></i> Generate / Refresh</button>
            <button class="btn btn-outline" id="resetPreviewBtn"><i class="fas fa-undo-alt"></i> Reset ke Avatar 3</button>
        </div>
    </div>

    <!-- Preview panel (streaming page) -->
    <div class="preview-header">
        <h2><i class="fas fa-tv" style="color:#3b82f6;"></i> ตัวอย่างหน้าเว็บสตรีมมิง</h2>
        <span class="pill">แสดงผลสด · ใช้ข้อมูลจาก TMDB</span>
    </div>

    <!-- STREAMING PAGE PREVIEW (injected by js) -->
    <div class="streaming-page" id="streamPreview">
        <!-- dynamic render -->
        <div style="padding: 2rem; text-align: center; color: #7a8bbf;" id="previewLoading"><i class="fas fa-spinner fa-pulse"></i> กำลังโหลดตัวอย่าง...</div>
    </div>

    <div class="footer-copyright">
        <i class="fas fa-crown"></i> Generator produksi · kolom API, judul, link download/tonton · gaya web streaming
    </div>
</div>

<script>
    (function() {
        // Konfigurasi & element references
        const apiKeyInput = document.getElementById('apiKeyInput');
        const movieIdInput = document.getElementById('movieIdInput');
        const langSelect = document.getElementById('langSelect');
        const link1Text = document.getElementById('link1Text');
        const link1Url = document.getElementById('link1Url');
        const link2Text = document.getElementById('link2Text');
        const link2Url = document.getElementById('link2Url');
        const generateBtn = document.getElementById('generateBtn');
        const resetBtn = document.getElementById('resetPreviewBtn');
        const previewContainer = document.getElementById('streamPreview');

        const DEFAULT_API = '3a660b31f4af8da5f2bd6f2799c11e2e';
        const DEFAULT_MOVIE = '76600'; // Avatar 3
        const IMG_BASE = 'https://image.tmdb.org/t/p/w500';

        // initial load
        function init() {
            apiKeyInput.value = DEFAULT_API;
            movieIdInput.value = DEFAULT_MOVIE;
            langSelect.value = 'th-TH';
            link1Text.value = '▶ ดูหนัง อวตาร 3 พากย์ไทย';
            link1Url.value = 'https://t.co/pmyrhw8flH';
            link2Text.value = '⬇️ ดาวน์โหลด อวตาร 3 (THAI)';
            link2Url.value = 'https://avatar3-thai.readme.io/';
            generatePreview();
        }

        // reset to avatar 3
        resetBtn.addEventListener('click', () => {
            movieIdInput.value = DEFAULT_MOVIE;
            langSelect.value = 'th-TH';
            link1Text.value = '▶ ดูหนัง อวตาร 3 พากย์ไทย';
            link1Url.value = 'https://t.co/pmyrhw8flH';
            link2Text.value = '⬇️ ดาวน์โหลด อวตาร 3 (THAI)';
            link2Url.value = 'https://avatar3-thai.readme.io/';
            generatePreview();
        });

        // generate button
        generateBtn.addEventListener('click', generatePreview);

        // core fetch
        async function fetchMovie(apiKey, movieId, language) {
            if (!apiKey || !movieId) return null;
            const url = `https://api.themoviedb.org/3/movie/${movieId}?api_key=${apiKey}&language=${language}`;
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`status ${res.status}`);
                return await res.json();
            } catch (e) {
                console.warn('TMDB fetch error', e);
                return null;
            }
        }

        async function fetchRecommendations(apiKey, movieId, language) {
            try {
                const url = `https://api.themoviedb.org/3/movie/${movieId}/recommendations?api_key=${apiKey}&language=${language}`;
                const res = await fetch(url);
                if (!res.ok) throw new Error();
                const data = await res.json();
                return data.results.slice(0, 6); // max 6
            } catch {
                return [];
            }
        }

        // render streaming page
        function renderPreview(movie, recommendations, link1TextVal, link1UrlVal, link2TextVal, link2UrlVal, lang) {
            if (!movie) {
                previewContainer.innerHTML = `<div class="error-banner"><i class="fas fa-exclamation-triangle"></i> ไม่พบข้อมูลจาก TMDB (ตรวจสอบ API key หรือ Movie ID) ใช้ตัวอย่างสำรอง</div>
                ${renderFallback(link1TextVal, link1UrlVal, link2TextVal, link2UrlVal)}`;
                return;
            }

            const posterPath = movie.poster_path ? `${IMG_BASE}${movie.poster_path}` : null;
            const title = movie.title || movie.original_title || 'ไม่มีชื่อ';
            const originalTitle = movie.original_title || '';
            const year = movie.release_date ? movie.release_date.slice(0,4) : 'N/A';
            const runtime = movie.runtime ? movie.runtime : '?';
            const genres = movie.genres ? movie.genres.slice(0,3).map(g => g.name).join(', ') : 'Unknown';
            const vote = movie.vote_average ? movie.vote_average.toFixed(1) : '?';
            const voteCount = movie.vote_count ? movie.vote_count.toLocaleString() : '0';
            const overview = movie.overview || 'ไม่มีคำอธิบาย';
            const tagline = movie.tagline ? movie.tagline : '';

            // recommendations html
            let recHtml = '';
            if (recommendations && recommendations.length > 0) {
                recHtml = recommendations.map(m => {
                    const recPoster = m.poster_path ? `${IMG_BASE}${m.poster_path}` : '';
                    return `<div class="rec-item">
                        ${recPoster ? `<img src="${recPoster}" alt="${m.title}" loading="lazy" onerror="this.style.display='none';this.parentElement.innerHTML+='<div class=\'rec-title\' style=\'padding:1rem;\'><i class=\'fas fa-film\'></i></div>'">` : '<div style="background:#1a2440; padding:1rem;text-align:center;"><i class="fas fa-image"></i></div>'}
                        <div class="rec-title">${m.title}</div>
                    </div>`;
                }).join('');
            } else {
                recHtml = '<div style="grid-column:1/-1; color:#6b80af;">ไม่มีคำแนะนำในภาษานี้</div>';
            }

            const link1Html = link1UrlVal ? `<a href="${link1UrlVal}" target="_blank" class="stream-link"><i class="fas fa-play-circle"></i> ${link1TextVal || 'รับชม'}</a>` : '';
            const link2Html = link2UrlVal ? `<a href="${link2UrlVal}" target="_blank" class="stream-link download-link"><i class="fas fa-download"></i> ${link2TextVal || 'ดาวน์โหลด'}</a>` : '';

            const html = `
                <div class="movie-hero">
                    <div class="poster-frame">
                        ${posterPath ? `<img src="${posterPath}" alt="${title}">` : `<div class="poster-placeholder"><i class="fas fa-poster" style="font-size:3rem;"></i><br>ไม่มีโปสเตอร์</div>`}
                    </div>
                    <div class="hero-content">
                        <h1>${title}</h1>
                        <div class="original-title">${originalTitle}</div>
                        <div class="meta-line">
                            <span class="meta-badge"><i class="far fa-calendar"></i> ${year}</span>
                            <span class="meta-badge"><i class="fas fa-clock"></i> ${runtime} นาที</span>
                            <span class="meta-badge"><i class="fas fa-tag"></i> ${genres}</span>
                            <span class="meta-badge rating"><i class="fas fa-star" style="color:gold;"></i> ${vote} (${voteCount})</span>
                        </div>
                        ${tagline ? `<div style="font-style:italic; color:#a7c2ff;">“${tagline}”</div>` : ''}
                        <div class="overview-box">
                            ${overview}
                        </div>
                    </div>
                </div>

                <!-- LINKS DOWNLOAD / STREAM  sesuai input -->
                <div class="links-section">
                    <div class="section-title-small"><i class="fas fa-link"></i> รับชม / ดาวน์โหลด</div>
                    <div class="link-grid">
                        ${link1Html}
                        ${link2Html}
                        <!-- tambahan link statis buat gaya streaming -->
                        <a href="#" class="stream-link" style="background:#2b2f4c;"><i class="fas fa-tv"></i> ดูบน Netflix (simulasi)</a>
                        <a href="#" class="stream-link" style="background:#3d3152;"><i class="fas fa-closed-captioning"></i> พากย์ไทย + ซับไทย</a>
                    </div>
                    <div style="margin-top: 1rem; font-size:0.9rem; background: #0d1428; padding:0.8rem 1.2rem; border-radius: 60px; display:inline-block;">
                        <i class="fas fa-info-circle"></i> ลิงก์ที่กำหนด: <strong>${link1TextVal}</strong> (${link1UrlVal}) และ ${link2TextVal}
                    </div>
                </div>

                <!-- คำแนะนำอื่นๆ จาก TMDB -->
                <div style="margin-top: 2.5rem;">
                    <div class="section-title-small"><i class="fas fa-thumbs-up"></i> คุณอาจจะชอบ</div>
                    <div class="rec-grid">
                        ${recHtml}
                    </div>
                </div>
            `;
            previewContainer.innerHTML = html;
        }

        function renderFallback(link1TextVal, link1UrlVal, link2TextVal, link2UrlVal) {
            return `
                <div class="movie-hero">
                    <div class="poster-frame"><div class="poster-placeholder"><i class="fas fa-image"></i> Poster example</div></div>
                    <div class="hero-content"><h1>อวตาร 3 (อัคนีและธุลีดิน)</h1><div class="original-title">Avatar: Fire and Ash</div>
                    <div class="meta-line"><span class="meta-badge">2025</span><span class="meta-badge">165 นาที</span><span class="meta-badge">Sci-Fi</span></div>
                    <div class="overview-box">กลับสู่แพนดอร่า ครอบครัวซัลลีเผชิญเผ่าไฟ ash people</div></div>
                </div>
                <div class="links-section">
                    <div class="link-grid">
                        <a href="${link1UrlVal}" class="stream-link"><i class="fas fa-play"></i> ${link1TextVal}</a>
                        <a href="${link2UrlVal}" class="stream-link download-link"><i class="fas fa-download"></i> ${link2TextVal}</a>
                    </div>
                </div>
                <div class="rec-grid">${Array(4).fill(0).map((_,i)=>'<div class="rec-item"><div style="background:#1f2a44;padding:1rem;"><i class="fas fa-film"></i> ตัวอย่าง</div></div>').join('')}</div>
            `;
        }

        async function generatePreview() {
            const apiKey = apiKeyInput.value.trim() || DEFAULT_API;
            const movieId = movieIdInput.value.trim() || DEFAULT_MOVIE;
            const lang = langSelect.value;
            const link1TextVal = link1Text.value.trim() || '▶ ดูหนัง';
            const link1UrlVal = link1Url.value.trim() || '#';
            const link2TextVal = link2Text.value.trim() || '⬇️ ดาวน์โหลด';
            const link2UrlVal = link2Url.value.trim() || '#';

            // tampilkan loading
            previewContainer.innerHTML = `<div style="padding: 3rem;text-align:center;"><i class="fas fa-spinner fa-pulse fa-2x"></i><br>กำลังโหลดข้อมูลจาก TMDB...</div>`;

            const movieData = await fetchMovie(apiKey, movieId, lang);
            let recommendations = [];
            if (movieData) {
                recommendations = await fetchRecommendations(apiKey, movieId, lang);
            }

            renderPreview(movieData, recommendations, link1TextVal, link1UrlVal, link2TextVal, link2UrlVal, lang);
        }

        init();
    })();
</script>
</body>
</html>
