        async function fetchMovie(apiKey, movieId, language) {
            if (!apiKey || !movieId) return null;
            const url = `https://api.themoviedb.org/3/movie/${movieId}?api_key=${apiKey}&language=${language}`;
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`status ${res.status}`);
                return await res.json();
            } catch (e) {
                console.warn('TMDB fetch error', e);
                return null;
            }
        }

        async function fetchRecommendations(apiKey, movieId, language) {
            try {
                const url = `https://api.themoviedb.org/3/movie/${movieId}/recommendations?api_key=${apiKey}&language=${language}`;
                const res = await fetch(url);
                if (!res.ok) throw new Error();
                const data = await res.json();
                return data.results.slice(0, 6);
            } catch {
                return [];
            }
        }

        // render preview (tanpa netflix button)
        function renderPreview(movie, recommendations, link1TextVal, link1UrlVal, link2TextVal, link2UrlVal, lang) {
            if (!movie) {
                previewContainer.innerHTML = `<div class="error-banner"><i class="fas fa-exclamation-triangle"></i> No data from TMDB (check API key / Movie ID). Using fallback.</div>
                ${renderFallback(link1TextVal, link1UrlVal, link2TextVal, link2UrlVal)}`;
                return;
            }

            const posterPath = movie.poster_path ? `${IMG_BASE}${movie.poster_path}` : null;
            const title = movie.title || movie.original_title || 'Unknown';
            const originalTitle = movie.original_title || '';
            const year = movie.release_date ? movie.release_date.slice(0,4) : 'N/A';
            const runtime = movie.runtime ? movie.runtime : '?';
            const genres = movie.genres ? movie.genres.slice(0,3).map(g => g.name).join(', ') : 'Unknown';
            const vote = movie.vote_average ? movie.vote_average.toFixed(1) : '?';
            const voteCount = movie.vote_count ? movie.vote_count.toLocaleString() : '0';
            const overview = movie.overview || 'No overview';
            const tagline = movie.tagline ? movie.tagline : '';

            let recHtml = '';
            if (recommendations && recommendations.length > 0) {
                recHtml = recommendations.map(m => {
                    const recPoster = m.poster_path ? `${IMG_BASE}${m.poster_path}` : '';
                    return `<div class="rec-item">
                        ${recPoster ? `<img src="${recPoster}" alt="${m.title}" loading="lazy">` : '<div style="background:#1a2440; padding:1rem;text-align:center;"><i class="fas fa-image"></i></div>'}
                        <div class="rec-title">${m.title}</div>
                    </div>`;
                }).join('');
            } else {
                recHtml = '<div style="grid-column:1/-1; color:#6b80af;">No recommendations in this language</div>';
            }

            const link1Html = link1UrlVal ? `<a href="${link1UrlVal}" target="_blank" class="stream-link"><i class="fas fa-play-circle"></i> ${link1TextVal || 'Watch'}</a>` : '';
            const link2Html = link2UrlVal ? `<a href="${link2UrlVal}" target="_blank" class="stream-link download-link"><i class="fas fa-download"></i> ${link2TextVal || 'Download'}</a>` : '';

            const html = `
                <div class="movie-hero">
                    <div class="poster-frame">
                        ${posterPath ? `<img src="${posterPath}" alt="${title}">` : `<div class="poster-placeholder"><i class="fas fa-poster" style="font-size:3rem;"></i><br>No poster</div>`}
                    </div>
                    <div class="hero-content">
                        <h1>${title}</h1>
                        <div class="original-title">${originalTitle}</div>
                        <div class="meta-line">
                            <span class="meta-badge"><i class="far fa-calendar"></i> ${year}</span>
                            <span class="meta-badge"><i class="fas fa-clock"></i> ${runtime} min</span>
                            <span class="meta-badge"><i class="fas fa-tag"></i> ${genres}</span>
                            <span class="meta-badge rating"><i class="fas fa-star" style="color:gold;"></i> ${vote} (${voteCount})</span>
                        </div>
                        ${tagline ? `<div style="font-style:italic; color:#a7c2ff;">“${tagline}”</div>` : ''}
                        <div class="overview-box">
                            ${overview}
                        </div>
                    </div>
                </div>

                <div class="links-section">
                    <div class="section-title-small"><i class="fas fa-link"></i> Watch / Download</div>
                    <div class="link-grid">
                        ${link1Html}
                        ${link2Html}
                        <!-- tombol NETFLIX dihapus sesuai permintaan -->
                    </div>
                    <div style="margin-top: 1rem; font-size:0.9rem; background: #0d1428; padding:0.8rem 1.2rem; border-radius: 60px; display:inline-block;">
                        <i class="fas fa-info-circle"></i> Custom links: ${link1TextVal} & ${link2TextVal}
                    </div>
                </div>

                <div style="margin-top: 2.5rem;">
                    <div class="section-title-small"><i class="fas fa-thumbs-up"></i> You may also like</div>
                    <div class="rec-grid">
                        ${recHtml}
                    </div>
                </div>
            `;
            previewContainer.innerHTML = html;
        }

        function renderFallback(link1TextVal, link1UrlVal, link2TextVal, link2UrlVal) {
            return `
                <div class="movie-hero">
                    <div class="poster-frame"><div class="poster-placeholder"><i class="fas fa-image"></i> Poster example</div></div>
                    <div class="hero-content"><h1>Avatar: Fire and Ash</h1><div class="original-title">Avatar 3</div>
                    <div class="meta-line"><span class="meta-badge">2025</span><span class="meta-badge">165 min</span><span class="meta-badge">Sci-Fi</span></div>
                    <div class="overview-box">Return to Pandora with the Sully family. They face the Ash People.</div></div>
                </div>
                <div class="links-section">
                    <div class="link-grid">
                        <a href="${link1UrlVal}" class="stream-link"><i class="fas fa-play"></i> ${link1TextVal}</a>
                        <a href="${link2UrlVal}" class="stream-link download-link"><i class="fas fa-download"></i> ${link2TextVal}</a>
                    </div>
                </div>
                <div class="rec-grid">${Array(4).fill(0).map(()=>'<div class="rec-item"><div style="background:#1f2a44;padding:1rem;"><i class="fas fa-film"></i> Example</div></div>').join('')}</div>
            `;
        }

        async function generatePreview() {
            const apiKey = apiKeyInput.value.trim() || DEFAULT_API;
            const movieId = movieIdInput.value.trim() || DEFAULT_MOVIE;
            const lang = langSelect.value;
            const link1TextVal = link1Text.value.trim() || '▶ Watch';
            const link1UrlVal = link1Url.value.trim() || '#';
            const link2TextVal = link2Text.value.trim() || '⬇️ Download';
            const link2UrlVal = link2Url.value.trim() || '#';

            // update pill
            const langNames = { 'en-US':'English', 'es-ES':'Español', 'th-TH':'ไทย', 'id-ID':'Indonesia', 'fr-FR':'Français', 'zh-CN':'中文', 'ja-JP':'日本語', 'ko-KR':'한국어', 'hi-IN':'हिन्दी', 'ru-RU':'Русский' };
            langPill.innerText = 'Idioma: ' + (langNames[lang] || lang);

            // loading
            previewContainer.innerHTML = `<div style="padding: 3rem;text-align:center;"><i class="fas fa-spinner fa-pulse fa-2x"></i><br>Loading TMDB data...</div>`;

            const movieData = await fetchMovie(apiKey, movieId, lang);
            let recommendations = [];
            if (movieData) {
                recommendations = await fetchRecommendations(apiKey, movieId, lang);
            }

            renderPreview(movieData, recommendations, link1TextVal, link1UrlVal, link2TextVal, link2UrlVal, lang);
            renderArticles(lang);
        }

        // reset
        resetBtn.addEventListener('click', () => {
            movieIdInput.value = DEFAULT_MOVIE;
            langSelect.value = 'es-ES';
            link1Text.value = '▶ Ver Película Avatar 3 HD';
            link1Url.value = 'https://t.co/pmyrhw8flH';
            link2Text.value = '⬇️ Descargar Avatar 3 (Español)';
            link2Url.value = 'https://avatar3-thai.readme.io/';
            generatePreview();
        });

        generateBtn.addEventListener('click', generatePreview);

        // initial load
        function init() {
            apiKeyInput.value = DEFAULT_API;
            movieIdInput.value = DEFAULT_MOVIE;
            langSelect.value = 'es-ES'; // default spanyol
            link1Text.value = '▶ Ver Película Avatar 3 HD';
            link1Url.value = 'https://t.co/pmyrhw8flH';
            link2Text.value = '⬇️ Descargar Avatar 3 (Español)';
            link2Url.value = 'https://avatar3-thai.readme.io/';
            generatePreview();
        }
        init();
    })();
</script>
</body>
</html>
