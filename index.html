<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 TMDB Generator (Simple & Stable)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Salin CSS dari kode sebelumnya atau gunakan CSS sederhana di sini */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1e; font-family: 'Inter', sans-serif; color: #eef3fc; padding: 2rem 1.5rem; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .subtitle { color: #8ba3d9; margin-bottom: 2rem; }
        .panel { background: #131f33; border-radius: 2rem; padding: 2rem; border: 1px solid #2d4068; margin-bottom: 2rem; }
        .input-group { margin-bottom: 1rem; }
        .input-group label { display: block; margin-bottom: 0.5rem; color: #9bb5ff; }
        .input-group input, .input-group select, .input-group textarea {
            width: 100%; background: #0b1425; border: 1px solid #2f4570; border-radius: 12px; padding: 0.8rem 1rem; color: white;
        }
        .btn { background: #1d4ed8; border: none; border-radius: 40px; padding: 0.8rem 1.8rem; color: white; cursor: pointer; }
        .log-area { background: #0a1220; border-radius: 1rem; padding: 1rem; min-height: 100px; font-family: monospace; }
    </style>
</head>
<body>
<div class="container">
    <h1>🔥 TMDB Generator (Simple & Stable)</h1>
    <div class="subtitle">Versi minimal untuk memastikan tools berfungsi</div>

    <div class="panel">
        <div class="input-group">
            <label><i class="fas fa-key"></i> TMDB API Key</label>
            <input type="text" id="apiKey" value="3a660b31f4af8da5f2bd6f2799c11e2e">
        </div>
        <div class="input-group">
            <label><i class="fas fa-list"></i> Daftar ID TMDB</label>
            <textarea id="movieIds" rows="3">76600, 157336</textarea>
        </div>
        <button class="btn" id="generateBtn"><i class="fas fa-cogs"></i> Generate & Log</button>
        <div style="margin-top: 1rem;">
            <h3>Log:</h3>
            <div class="log-area" id="logArea">⏳ Siap...</div>
        </div>
    </div>
</div>

<script>
    (function() {
        const apiKeyInput = document.getElementById('apiKey');
        const movieIdsTextarea = document.getElementById('movieIds');
        const generateBtn = document.getElementById('generateBtn');
        const logArea = document.getElementById('logArea');

        function log(message) {
            logArea.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${message}</div>`;
            logArea.scrollTop = logArea.scrollHeight;
        }

        async function testFetch(movieId) {
            const apiKey = apiKeyInput.value.trim();
            const url = `https://api.themoviedb.org/3/movie/${movieId}?api_key=${apiKey}`;
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                log(`✅ ID ${movieId}: ${data.title} berhasil diambil.`);
                return data;
            } catch (e) {
                log(`❌ ID ${movieId} gagal: ${e.message}`);
                return null;
            }
        }

        generateBtn.addEventListener('click', async () => {
            logArea.innerHTML = ''; // Clear log
            log('🚀 Memulai proses...');
            const idsText = movieIdsTextarea.value.trim();
            const idMatches = idsText.match(/\d+/g);
            if (!idMatches) {
                log('❌ Tidak ada ID ditemukan.');
                return;
            }
            for (const movieId of idMatches) {
                await testFetch(movieId);
            }
            log('🎉 Selesai.');
        });

        log('✅ Tools siap. Masukkan ID dan klik Generate.');
    })();
</script>
</body>
</html>
