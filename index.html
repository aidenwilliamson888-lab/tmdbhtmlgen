<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function() {
    // ========== KONFIGURASI ==========
    const IMG_BASE = 'https://image.tmdb.org/t/p/w500';
    const BACKDROP_BASE = 'https://image.tmdb.org/t/p/original';
    const DEFAULT_API = '3a660b31f4af8da5f2bd6f2799c11e2e';
    
    // ========== ELEMEN DOM ==========
    const apiKeyInput = document.getElementById('apiKey');
    const movieIdsTextarea = document.getElementById('movieIds');
    const bulkLang = document.getElementById('bulkLang');
    const bulkLink1Text = document.getElementById('bulkLink1Text');
    const bulkLink2Text = document.getElementById('bulkLink2Text');
    const titleTemplatesArea = document.getElementById('titleTemplates');
    const generateBtn = document.getElementById('generateBulkBtn');
    const downloadBtn = document.getElementById('downloadZipBtn');
    const clearLogsBtn = document.getElementById('clearLogsBtn');
    const logArea = document.getElementById('logArea');
    const progressPercent = document.getElementById('progressPercent');
    const progressFill = document.getElementById('progressFill');
    const generatedCountSpan = document.getElementById('generatedCount');
    const totalCountSpan = document.getElementById('totalCount');
    const filePreviewGrid = document.getElementById('filePreviewGrid');
    const previewCountSpan = document.getElementById('previewCount');

    let generatedFiles = [];
    let isGenerating = false;

    // ========== FUNGSI BANTU ==========
    function log(message, type = 'info') {
        const entry = document.createElement('div');
        entry.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
        entry.style.color = type === 'error' ? '#f87171' : type === 'success' ? '#4ade80' : '#a5d8ff';
        logArea.appendChild(entry);
        logArea.scrollTop = logArea.scrollHeight;
    }

    function clearLogs() { logArea.innerHTML = '<div>⏳ Log dibersihkan...</div>'; }

    function getTitleTemplates() {
        const text = titleTemplatesArea.value.trim();
        return text ? text.split('|').map(t => t.trim()).filter(t => t.length) : ['{TITLE} (2026) Watch Online'];
    }

    function getRandomTitle(templates, movieTitle) {
        if (!templates.length) return movieTitle;
        return templates[Math.floor(Math.random() * templates.length)].replace(/{TITLE}/g, movieTitle);
    }

    // ========== FETCH TMDB LENGKAP ==========
    async function fetchMovieDetails(apiKey, movieId, language) {
        const url = `https://api.themoviedb.org/3/movie/${movieId}?api_key=${apiKey}&language=${language}&append_to_response=videos,images,recommendations`;
        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return await res.json();
        } catch (e) {
            log(`❌ Gagal fetch ID ${movieId}: ${e.message}`, 'error');
            return null;
        }
    }

    // ========== GENERATE HTML PREMIUM ==========
    async function generateMovieHTML(apiKey, movieId, lang, link1Text, link2Text, titleTemplates) {
        const movie = await fetchMovieDetails(apiKey, movieId, lang);
        if (!movie) return null;

        const seoTitle = getRandomTitle(titleTemplates, movie.title);
        const year = movie.release_date ? movie.release_date.slice(0,4) : new Date().getFullYear();
        
        // Cari trailer YouTube
        const trailer = movie.videos?.results?.find(v => v.site === 'YouTube' && (v.type === 'Trailer' || v.type === 'Teaser'));
        const trailerKey = trailer?.key || null;
        
        // Backdrop
        const backdropUrl = movie.backdrop_path ? BACKDROP_BASE + movie.backdrop_path : null;
        
        // Rekomendasi (max 4)
        const recommendations = movie.recommendations?.results?.slice(0, 4) || [];

        // Artikel SEO panjang (dengan konten dinamis)
        const articleQuote = `"You ran from Woodsboro. You ran from New York. But you can’t run from me." — This chilling line captures the essence of the franchise: no matter how far you go, the terror follows. ${movie.title} promises a darker, more psychological edge while maintaining the classic thrills fans love.`;
        
        const articleAnalysis = `With stunning visuals and a gripping narrative, ${movie.title} expands the universe in unexpected ways. New characters, moral complexities, and breathtaking action sequences make this a must-watch for cinema lovers.`;

        // ===== HTML TEMPLATE =====
        const html = `<!DOCTYPE html>
<html lang="${lang}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${seoTitle}</title>
    <meta name="description" content="${movie.overview ? movie.overview.substring(0, 160).replace(/"/g, '&quot;') : 'Watch online'}">
    <meta name="keywords" content="${movie.title}, watch online, download, ${year}, 4k, hd, streaming">
    <meta property="og:title" content="${seoTitle}">
    <meta property="og:image" content="${movie.poster_path ? IMG_BASE + movie.poster_path : ''}">
    <meta property="og:type" content="video.movie">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0b0f1a; font-family: 'Inter', sans-serif; color: #eef3fc; }
        .backdrop {
            width: 100%; height: 400px; background-size: cover; background-position: center 20%;
            position: relative; display: flex; align-items: flex-end; padding: 2rem;
        }
        .backdrop::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(0deg, #0b0f1a 0%, transparent 50%);
        }
        .backdrop-content { position: relative; z-index: 2; max-width: 1200px; margin: 0 auto; width: 100%; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }
        .movie-card { background: #131f33; border-radius: 2rem; padding: 2rem; border: 1px solid #2d4068; margin-bottom: 2rem; }
        .movie-hero { display: grid; grid-template-columns: 260px 1fr; gap: 2rem; }
        .poster { border-radius: 1.5rem; overflow: hidden; background: #0b1425; aspect-ratio: 2/3; }
        .poster img { width: 100%; height: 100%; object-fit: cover; }
        h1 { font-size: 2.5rem; }
        .meta { display: flex; gap: 1rem; margin: 1rem 0; flex-wrap: wrap; }
        .meta span { background: #1b2848; padding: 0.4rem 1.2rem; border-radius: 30px; }
        .overview { background: #0b1425b0; border-radius: 1.5rem; padding: 1.3rem; margin: 1.5rem 0; }
        .links { display: flex; gap: 1rem; flex-wrap: wrap; }
        .link-btn {
            background: #1f2c48; padding: 0.8rem 1.8rem; border-radius: 40px; color: white;
            text-decoration: none; display: inline-flex; align-items: center; gap: 0.6rem;
            border: 1px solid #3f5b92; transition: 0.2s;
        }
        .link-btn:hover { background: #2d4070; transform: translateY(-2px); }
        
        .trailer-container {
            margin: 2rem 0; border-radius: 1.5rem; overflow: hidden;
            aspect-ratio: 16/9; background: #0b1425; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .trailer-container iframe { width: 100%; height: 100%; border: none; }
        
        .article {
            background: #0f1a2b; border-radius: 1.8rem; padding: 1.6rem;
            margin-top: 2rem; border: 1px solid #2f456e;
        }
        .article h2 { font-size: 1.8rem; margin-bottom: 1rem; }
        .article-meta { color: #8099cf; margin-bottom: 1rem; }
        .article-quote {
            font-style: italic; border-left: 4px solid #3b82f6;
            padding-left: 1.5rem; margin: 1.5rem 0; color: #b5d0ff;
        }
        
        .rec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; margin-top: 2rem; }
        .rec-item { background: #162035; border-radius: 1rem; overflow: hidden; transition: 0.2s; }
        .rec-item:hover { transform: scale(1.02); }
        .rec-item img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .rec-item .rec-title { padding: 0.5rem; font-size: 0.85rem; }
        
        .footer { margin-top: 2rem; color: #5f79b0; text-align: center; }
        @media (max-width: 700px) { .movie-hero { grid-template-columns: 1fr; } .backdrop { height: 250px; } }
    </style>
</head>
<body>
    ${backdropUrl ? `
    <div class="backdrop" style="background-image: url('${backdropUrl}');">
        <div class="backdrop-content"><h1 style="font-size: 3rem;">${movie.title}</h1></div>
    </div>` : ''}

    <div class="container">
        <div class="movie-card">
            <div class="movie-hero">
                <div class="poster">
                    ${movie.poster_path ? `<img src="${IMG_BASE}${movie.poster_path}" alt="${movie.title}">` : '<div style="display: flex; align-items: center; justify-content: center; height: 100%;"><i class="fas fa-film fa-3x"></i></div>'}
                </div>
                <div>
                    <h1>${movie.title}</h1>
                    <div style="color: #97b5f0;">${movie.original_title || ''}</div>
                    <div class="meta">
                        <span><i class="far fa-calendar"></i> ${year}</span>
                        <span><i class="fas fa-clock"></i> ${movie.runtime || '?'} min</span>
                        <span><i class="fas fa-star" style="color: gold;"></i> ${movie.vote_average?.toFixed(1) || '?'}</span>
                    </div>
                    <div class="overview">${movie.overview || 'No overview available.'}</div>
                    <div class="links">
                        <a href="#" class="link-btn" onclick="return false;"><i class="fas fa-play-circle"></i> ${link1Text}</a>
                        <a href="#" class="link-btn" style="background:#1d3a3a;" onclick="return false;"><i class="fas fa-download"></i> ${link2Text}</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- TRAILER SECTION (FIX) -->
        ${trailerKey ? `
        <h2 style="margin-bottom: 1rem;"><i class="fab fa-youtube" style="color:#ff0000;"></i> Official Trailer</h2>
        <div class="trailer-container">
            <iframe src="https://www.youtube.com/embed/${trailerKey}?rel=0&modestbranding=1" 
                    title="${movie.title} trailer" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen
                    loading="lazy">
            </iframe>
        </div>
        ` : backdropUrl ? `
        <h2 style="margin-bottom: 1rem;"><i class="fas fa-image"></i> Featured Scene</h2>
        <div style="aspect-ratio: 16/9; border-radius: 1.5rem; overflow: hidden; background-image: url('${backdropUrl}'); background-size: cover; background-position: center; margin: 2rem 0;">
            <div style="width: 100%; height: 100%; background: linear-gradient(0deg, rgba(0,0,0,0.5) 0%, transparent 100%); display: flex; align-items: flex-end; padding: 2rem;">
                <h3 style="color: white;">${movie.title}</h3>
            </div>
        </div>
        ` : ''}

        <!-- ARTIKEL SEO 1 -->
        <div class="article">
            <h2>${movie.title}: The Story Unveiled</h2>
            <div class="article-meta"><i class="far fa-clock"></i> 15 min read · updated ${year}</div>
            <p>${movie.overview || 'The film brings new adventures and stunning visual effects.'} The story continues with exciting twists and turns, pushing the boundaries of storytelling.</p>
            <div class="article-quote">${articleQuote}</div>
            <p>The psychological depth and intense narrative structure make this installment a standout. Fans will appreciate the callbacks while being introduced to fresh elements that expand the universe.</p>
        </div>

        <!-- ARTIKEL SEO 2 -->
        <div class="article">
            <h2>Where to Watch ${movie.title} Online</h2>
            <div class="article-meta"><i class="fas fa-tag"></i> Legal sources · 4K UHD</div>
            <p>Looking for where to watch ${movie.title} online? While official streaming platforms will announce dates after theatrical release, fans are already searching for ways to experience this epic film. We recommend checking:</p>
            <ul style="margin: 1rem 0 0 2rem; color: #cbd5e1;">
                <li>Disney+ Hotstar (expected release)</li>
                <li>Netflix (regional availability)</li>
                <li>Amazon Prime Video (rental/purchase)</li>
                <li>Local streaming providers in your country</li>
            </ul>
        </div>

        <!-- ARTIKEL SEO 3 -->
        <div class="article">
            <h2>Why ${movie.title} Changes Everything</h2>
            <div class="article-meta"><i class="fas fa-chart-line"></i> Analysis · new characters</div>
            <p>The introduction of new characters and conflicts adds moral complexity to the franchise. This installment expands the universe significantly, setting up potential for future sequels and spin-offs.</p>
            <div class="article-quote">${articleAnalysis}</div>
            <p>With groundbreaking visual effects and a compelling narrative, ${movie.title} raises the bar for blockbuster filmmaking. The world-building is meticulous, and the attention to detail in every frame showcases the passion of the creative team.</p>
        </div>

        <!-- REKOMENDASI -->
        ${recommendations.length ? `
        <h3 style="margin: 2rem 0 1rem;"><i class="fas fa-thumbs-up"></i> You may also like</h3>
        <div class="rec-grid">
            ${recommendations.map(m => `
                <div class="rec-item">
                    ${m.poster_path ? `<img src="${IMG_BASE}${m.poster_path}" alt="${m.title}" loading="lazy">` : '<div style="background:#1a2440; padding:1.5rem; text-align:center;"><i class="fas fa-image fa-2x"></i></div>'}
                    <div class="rec-title">${m.title}</div>
                </div>
            `).join('')}
        </div>
        ` : ''}

        <div class="footer">
            <i class="fas fa-crown"></i> Generated by TMDB Generator · ID ${movieId} · ${year}
        </div>
    </div>
</body>
</html>`;
        return { html, title: movie.title, movieId };
    }

    // ========== BULK GENERATE ==========
    async function bulkGenerate() {
        if (isGenerating) { log('⏳ Masih dalam proses...', 'error'); return; }

        const apiKey = apiKeyInput.value.trim() || DEFAULT_API;
        const lang = bulkLang.value;
        const link1Text = bulkLink1Text.value.trim() || '▶ Watch';
        const link2Text = bulkLink2Text.value.trim() || '⬇️ Download';
        const titleTemplates = getTitleTemplates();
        
        const idsText = movieIdsTextarea.value.trim();
        const idMatches = idsText.match(/\d+/g);
        if (!idMatches?.length) { log('❌ Tidak ada ID valid', 'error'); return; }

        const uniqueIds = [...new Set(idMatches)];
        totalCountSpan.innerText = uniqueIds.length;
        generatedCountSpan.innerText = '0';
        progressPercent.innerText = '0%';
        progressFill.style.width = '0%';
        generatedFiles = [];
        updateFilePreview();

        log(`🚀 Generate ${uniqueIds.length} file dengan trailer fix...`);
        isGenerating = true;
        downloadBtn.disabled = true;

        let successCount = 0;
        for (let i = 0; i < uniqueIds.length; i++) {
            const movieId = uniqueIds[i];
            log(`⏳ [${i+1}/${uniqueIds.length}] ID ${movieId}...`);

            const result = await generateMovieHTML(apiKey, movieId, lang, link1Text, link2Text, titleTemplates);
            
            if (result) {
                const safeTitle = result.title.replace(/[^a-z0-9]/gi, '_').substring(0, 40);
                generatedFiles.push({
                    filename: `${movieId}_${safeTitle}.html`,
                    content: result.html,
                    movieId,
                    title: result.title
                });
                successCount++;
                log(`✅ ID ${movieId} (${result.title}) berhasil`, 'success');
            }

            const percent = Math.round(((i + 1) / uniqueIds.length) * 100);
            progressPercent.innerText = `${percent}%`;
            progressFill.style.width = `${percent}%`;
            generatedCountSpan.innerText = successCount;
            updateFilePreview();
        }

        log(`🎉 Selesai! ${successCount} file`, 'success');
        isGenerating = false;
        if (successCount > 0) downloadBtn.disabled = false;
    }

    function updateFilePreview() {
        previewCountSpan.innerText = generatedFiles.length;
        if (!generatedFiles.length) {
            filePreviewGrid.innerHTML = '<div style="color: #6b83b0;">Belum ada file</div>';
            return;
        }
        filePreviewGrid.innerHTML = generatedFiles.map(f => `
            <div class="file-card">
                <i class="fas fa-file-code"></i> ${f.filename.substring(0, 25)}...
                <div style="font-size:0.7rem; color:#8ba3d9;">${f.title}</div>
            </div>
        `).join('');
    }

    function downloadZip() {
        if (!generatedFiles.length) return;
        const zip = new JSZip();
        generatedFiles.forEach(f => zip.file(f.filename, f.content));
        zip.generateAsync({ type: 'blob' }).then(blob => {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `tmdb_movies_${Date.now()}.zip`;
            link.click();
            log('📦 ZIP berhasil didownload', 'success');
        });
    }

    // ========== EVENT ==========
    generateBtn.addEventListener('click', bulkGenerate);
    downloadBtn.addEventListener('click', downloadZip);
    clearLogsBtn.addEventListener('click', clearLogs);

    titleTemplatesArea.addEventListener('input', () => {
        const templates = getTitleTemplates();
        if (templates.length) {
            document.getElementById('templateExample').innerHTML = 
                `<i class="fas fa-eye"></i> Contoh: "${templates[0].replace(/{TITLE}/g, 'Avatar 3').substring(0, 60)}..."`;
        }
    });

    log('✅ FINAL VERSION READY · Trailer fix, backdrop, 3 artikel SEO, rekomendasi');
})();
</script>
</body>
</html>
