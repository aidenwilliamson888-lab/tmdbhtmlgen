<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Book - Petualangan di Dunia Maya</title>
    <!-- Font Awesome 6 (free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #f0f4fa 0%, #e6ecf3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }
        .card {
            max-width: 1200px;
            width: 100%;
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px 48px 40px 40px;
            box-shadow: 0 30px 60px -20px rgba(0,20,40,0.35), 0 8px 20px rgba(255,255,255,0.6) inset;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.6);
        }
        .hero {
            background: linear-gradient(112deg, #1e2b3a 0%, #14222e 100%);
            color: white;
            padding: 2.8rem 3rem 2.5rem 3rem;
            position: relative;
            border-bottom: 4px solid #ffb347;
        }
        .hero::after {
            content: "📖";
            font-size: 140px;
            opacity: 0.08;
            position: absolute;
            bottom: -20px;
            right: 30px;
            transform: rotate(8deg);
            pointer-events: none;
        }
        .badge {
            background: #ffb347;
            color: #1e2b3a;
            padding: 0.3rem 1.2rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            display: inline-block;
            margin-bottom: 1.2rem;
            border: 1px solid #ffcf8a;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }
        h1 {
            font-size: 3.2rem;
            font-weight: 800;
            line-height: 1.2;
            max-width: 800px;
            text-shadow: 0 4px 12px rgba(0,0,0,0.3);
        }
        .subhead {
            font-size: 1.3rem;
            margin-top: 0.8rem;
            opacity: 0.8;
            font-weight: 300;
            max-width: 650px;
        }
        .book-detail-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 2.5rem;
            padding: 2.8rem 3rem;
            background: #ffffffd9;
            backdrop-filter: blur(4px);
        }
        .cover-col {
            flex: 0 0 260px;
        }
        .cover-image {
            width: 100%;
            border-radius: 28px;
            box-shadow: 0 25px 35px -10px rgba(0,0,0,0.35);
            border: 2px solid white;
            transition: transform 0.25s ease;
            background: #eaeef2;
            aspect-ratio: 2/3;
            object-fit: cover;
        }
        .cover-image:hover {
            transform: scale(1.02);
        }
        .info-col {
            flex: 1;
            min-width: 280px;
        }
        .meta-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem 1.2rem;
            margin-bottom: 1.6rem;
        }
        .meta-tag {
            background: white;
            padding: 0.3rem 1.2rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #14222e;
            box-shadow: 0 3px 8px #00000010;
            border: 1px solid #cddbe8;
        }
        .meta-tag i {
            color: #ff9f1c;
            margin-right: 6px;
        }
        h2 {
            font-size: 2.3rem;
            font-weight: 700;
            color: #0f1a24;
            line-height: 1.3;
            margin-bottom: 0.4rem;
        }
        .author {
            font-size: 1.4rem;
            font-weight: 400;
            color: #2e4055;
            margin-bottom: 1.4rem;
            border-left: 5px solid #ffb347;
            padding-left: 1rem;
        }
        .description {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #1f2d3a;
            background: #f8fbfe;
            padding: 1.6rem;
            border-radius: 28px;
            margin: 1.8rem 0 2rem 0;
            border: 1px solid #cbdae7;
            box-shadow: inset 0 1px 5px #ffffff, 0 8px 14px -8px #9fb1c4;
        }
        .dl-section {
            background: #edf4fa;
            border-radius: 40px;
            padding: 2rem 2rem 2.2rem 2rem;
            margin-top: 2rem;
            border: 1px solid #ffffff;
            box-shadow: 0 12px 18px -15px #1d2e3f;
        }
        .dl-header {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.7rem;
            font-weight: 700;
            color: #12212e;
            margin-bottom: 1.5rem;
        }
        .dl-header i {
            background: #1e2b3a;
            color: white;
            padding: 12px;
            border-radius: 60px;
            font-size: 1.3rem;
            box-shadow: 0 6px 0 #0f1a24;
        }
        .dl-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            margin-bottom: 28px;
        }
        .dl-btn {
            background: white;
            border: 2px solid #1e2b3a;
            padding: 0.9rem 1.8rem;
            border-radius: 100px;
            font-weight: 700;
            font-size: 1.2rem;
            color: #1e2b3a;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            transition: 0.2s;
            box-shadow: 0 7px 0 #0f1a24;
            flex: 0 1 auto;
        }
        .dl-btn i {
            font-size: 1.5rem;
            color: #ff9f1c;
        }
        .dl-btn:hover {
            background: #f5cba0;
            transform: translateY(-3px);
            box-shadow: 0 10px 0 #0f1a24;
        }
        .dl-btn:active {
            transform: translateY(5px);
            box-shadow: 0 2px 0 #0f1a24;
        }
        .format-note {
            font-size: 0.95rem;
            color: #2b4a6b;
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: #ffffffaa;
            padding: 8px 18px;
            border-radius: 60px;
            width: fit-content;
            border: 1px dashed #1e2b3a;
        }
        .footer-note {
            padding: 1.2rem 3rem;
            background: #d3e0ec;
            font-size: 0.95rem;
            color: #1a2938;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            border-top: 2px solid white;
        }
        .footer-note a {
            color: #0b1c2c;
            font-weight: 600;
            text-decoration: none;
            border-bottom: 2px solid #ffb347;
        }
        .loading, .error {
            padding: 3rem;
            text-align: center;
            font-size: 1.6rem;
            background: #fff;
        }
        .loading i, .error i {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #ff9f1c;
        }
        @media (max-width: 700px) {
            h1 { font-size: 2.3rem; }
            .hero { padding: 2rem 1.8rem; }
            .book-detail-panel { padding: 2rem 1.5rem; }
            .cover-col { flex: 0 0 200px; }
            .dl-btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

<div class="card" id="bookCard">
    <!-- Akan diisi oleh JavaScript -->
    <div class="loading" style="padding: 5rem; text-align: center;">
        <i class="fas fa-spinner fa-pulse fa-3x"></i>
        <h3>Memuat buku dari OpenLibrary...</h3>
    </div>
</div>

<script>
    (function() {
        // --- KONFIGURASI ---
        // Menggunakan API OpenLibrary yang stabil
        const WORK_ID = 'OL27448W';   // "The Lord of the Rings" sebagai contoh ikonik, ganti sesuai keinginan
        // Atau bisa juga gunakan ISBN (lebih stabil untuk edisi tertentu): const ISBN = '9780544003415'; (The Fellowship)
        // Untuk demo ini kita gunakan work populer
        
        // Fungsi fetch data dari OpenLibrary
        async function loadBookData() {
            const container = document.getElementById('bookCard');
            
            try {
                // 1. Ambil data Work (detail utama)
                const workRes = await fetch(`https://openlibrary.org/works/${WORK_ID}.json`);
                if (!workRes.ok) throw new Error(`Gagal ambil work (${workRes.status})`);
                const work = await workRes.json();
                
                // 2. Ambil edisi pertama yang punya sampul (atau ambil dari work)
                let edition = null;
                let coverId = null;
                let isbn = null;
                
                // Coba cari edisi dengan cover via search (lebih kompleks, kita sederhanakan)
                // Alternatif: pakai /search?q= dan limit=1 dengan field covers
                const searchRes = await fetch(`https://openlibrary.org/search.json?title=${encodeURIComponent(work.title)}&author=${work.authors?.[0]?.author?.key?.replace('/authors/', '') || ''}&fields=key,title,author_name,cover_i,isbn,first_publish_year&limit=3`);
                if (searchRes.ok) {
                    const searchData = await searchRes.json();
                    const docWithCover = searchData.docs.find(d => d.cover_i) || searchData.docs[0];
                    if (docWithCover) {
                        coverId = docWithCover.cover_i;
                        isbn = docWithCover.isbn?.[0];
                    }
                }
                
                // 3. Jika tidak dapat cover, gunakan cover default / placeholder
                const coverUrl = coverId 
                    ? `https://covers.openlibrary.org/b/id/${coverId}-L.jpg` 
                    : 'https://covers.openlibrary.org/b/id/12389591-L.jpg'; // fallback iconic

                // 4. Siapkan data untuk tampilan
                const title = work.title || 'Petualangan di Dunia Maya';
                // Ambil author dari work (mungkin perlu fetch author terpisah, sederhanakan)
                let authorName = 'J.R.R. Tolkien'; // fallback
                if (work.authors && work.authors[0]?.author?.key) {
                    try {
                        const authorRes = await fetch(`https://openlibrary.org${work.authors[0].author.key}.json`);
                        const authorData = await authorRes.json();
                        authorName = authorData.name || 'Tidak diketahui';
                    } catch {
                        authorName = work.authors[0].name || 'Penulis terkenal';
                    }
                }
                
                const description = typeof work.description === 'string' 
                    ? work.description 
                    : (work.description?.value || 'Sebuah epik luar biasa tentang petualangan, persahabatan, dan kekuatan imajinasi. Buku ini telah memikat jutaan pembaca di seluruh dunia dan kini tersedia untuk diunduh dalam berbagai format. Nikmati kisah tak terlupakan ini kapan saja, di mana saja.');
                
                const firstPublish = work.first_publish_date || work.created?.value?.slice(0,4) || '1954';
                const pages = work.number_of_pages || '384';
                const subjects = work.subjects?.slice(0, 3) || ['Fantasi', 'Petualangan', 'Fiksi'];
                
                // 5. Bangun HTML
                container.innerHTML = `
                    <div class="hero">
                        <span class="badge"><i class="fas fa-crown" style="margin-right: 6px;"></i> BESTSELLER INTERNASIONAL</span>
                        <h1>${title}</h1>
                        <div class="subhead">Edisi Kolektor • Terjemahan Resmi • Bonus Konten</div>
                    </div>
                    
                    <div class="book-detail-panel">
                        <div class="cover-col">
                            <img src="${coverUrl}" alt="Sampul Buku" class="cover-image" onerror="this.src='https://covers.openlibrary.org/b/id/12389591-L.jpg'">
                        </div>
                        <div class="info-col">
                            <div class="meta-tags">
                                <span class="meta-tag"><i class="fas fa-calendar-alt"></i> ${firstPublish}</span>
                                <span class="meta-tag"><i class="fas fa-book-open"></i> ${pages} hlm</span>
                                <span class="meta-tag"><i class="fas fa-tags"></i> ${subjects.join(', ')}</span>
                                <span class="meta-tag"><i class="fas fa-language"></i> Indonesia</span>
                            </div>
                            
                            <h2>${title}</h2>
                            <div class="author">✍️ ${authorName}</div>
                            
                            <div class="description">
                                <i class="fas fa-quote-left" style="color: #ffb347; opacity: 0.6; margin-right: 8px;"></i>
                                ${description}
                            </div>
                            
                            <div class="dl-section">
                                <div class="dl-header">
                                    <i class="fas fa-download"></i> Unduh Gratis
                                </div>
                                <div class="dl-grid">
                                    <a href="#" class="dl-btn" id="downloadEPUB"><i class="fas fa-file-pdf"></i> EPUB (3.2 MB)</a>
                                    <a href="#" class="dl-btn" id="downloadMOBI"><i class="fas fa-file-lines"></i> MOBI (2.9 MB)</a>
                                    <a href="#" class="dl-btn" id="downloadPDF"><i class="fas fa-file-pdf"></i> PDF (5.1 MB)</a>
                                    <a href="#" class="dl-btn" id="downloadTXT"><i class="fas fa-file-lines"></i> TXT (1.4 MB)</a>
                                </div>
                                <div class="format-note">
                                    <i class="fas fa-shield-alt"></i> Semua file aman, bebas DRM, dan kompatibel dengan e-reader favoritmu.
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="footer-note">
                        <span><i class="fas fa-dragon"></i> Data dari OpenLibrary (domain publik / sampel)</span>
                        <span>🔍 <a href="https://openlibrary.org/works/${WORK_ID}" target="_blank">Lihat di OpenLibrary <i class="fas fa-external-link-alt"></i></a></span>
                    </div>
                `;

                // 6. Tambahkan event listener untuk tombol download (simulasi / redirect ke file)
                // Sebagai contoh, arahkan ke file dummy (ganti dengan link asli jika ada)
                document.getElementById('downloadEPUB').addEventListener('click', (e) => {
                    e.preventDefault();
                    alert('🔗 Demo: file unduhan akan muncul di sini. (koneksi ke OpenLibrary)');
                    window.open('https://openlibrary.org/works/' + WORK_ID, '_blank');
                });
                document.getElementById('downloadMOBI').addEventListener('click', (e) => {
                    e.preventDefault();
                    alert('📘 MOBI (demo) – Silakan kunjungi OpenLibrary untuk edisi gratis.');
                    window.open('https://openlibrary.org/works/' + WORK_ID, '_blank');
                });
                document.getElementById('downloadPDF').addEventListener('click', (e) => {
                    e.preventDefault();
                    alert('📕 PDF (demo) – kunjungi OpenLibrary untuk akses ke edisi digital.');
                    window.open('https://openlibrary.org/works/' + WORK_ID, '_blank');
                });
                document.getElementById('downloadTXT').addEventListener('click', (e) => {
                    e.preventDefault();
                    alert('📃 TXT (demo) – tersedia di OpenLibrary dalam format teks.');
                    window.open('https://openlibrary.org/works/' + WORK_ID, '_blank');
                });

            } catch (err) {
                console.error(err);
                container.innerHTML = `
                    <div class="error" style="padding: 4rem; text-align: center;">
                        <i class="fas fa-exclamation-triangle" style="font-size: 4rem; color: #c04040;"></i>
                        <h2>Gagal memuat data buku</h2>
                        <p style="margin-top: 1rem;">${err.message}. Coba refresh atau gunakan buku contoh.</p>
                        <button onclick="location.reload()" style="padding: 0.8rem 2rem; margin-top: 2rem; background: #1e2b3a; color: white; border: none; border-radius: 60px;">🔄 Muat Ulang</button>
                    </div>
                `;
            }
        }

        // Jalankan
        loadBookData();
    })();
</script>

<!-- Catatan: kode ini menggunakan work "The Lord of the Rings" (OL27448W) sebagai sampel buku populer.
     Anda dapat mengganti WORK_ID dengan ID buku favorit dari OpenLibrary, misalnya:
     - OL15626917W (Gulliver's Travels)
     - OL18417W (The Wonderful Wizard of Oz)
     - Atau gunakan ISBN: '9780451524935' (1984) dengan modifikasi endpoint -->
</body>
</html>
